name: 'aws_dbt_snowflake_project'
version: '1.0.0'

profile: 'aws_dbt_snowflake_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  aws_dbt_snowflake_project:
    # Config indicated by + and applies to all files under models/example/
    bronze:
      +materialized: table

# models in `models/marketing/ will be built in the "*_marketing" schema
models:
  aws_dbt_snowflake_project:
    bronze:    # bronze folder
      +materialized: table
      +schema: bronze   # bronze schema
    silver:
      +materialized: table
      +schema: silver   # silver schema
    gold:
      +materialized: table
      +schema: gold     # gold schema
